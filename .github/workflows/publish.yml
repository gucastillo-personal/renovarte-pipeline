# Fase 3 (PLAN.md): ingest -> transform -> publish, corriendo en CI en vez
# de la máquina del admin. `publish` nunca pushea a main de
# renovarte-catalogo — siempre abre (o actualiza) un PR; el merge es manual.
#
# Secrets a configurar en este repo (Settings > Secrets and variables >
# Actions), nunca en el código:
#   SERLACA_API_KEY, SERLACA_LACA_ID       — etapa 1 (ingest)
#   SERLACA_IMAGE_BASE, MARGIN_PERCENT_*   — etapa 2 (transform)
#   CATALOGO_PAT                            — fine-grained PAT, scoped SOLO a
#     renovarte-catalogo, permisos Contents (read/write) + Pull requests
#     (read/write). Nunca un PAT con acceso a toda la cuenta.
name: Publicar catálogo

on:
  schedule:
    - cron: "0 9 * * 1" # lunes 09:00 UTC — ajustar al ritmo real de precios de LACA
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout renovarte-pipeline
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Etapa 1 — ingest (descarga cruda de Serlaca)
        env:
          SERLACA_API_KEY: ${{ secrets.SERLACA_API_KEY }}
          SERLACA_LACA_ID: ${{ secrets.SERLACA_LACA_ID }}
        run: uv run renovarte-pipeline ingest

      - name: Etapa 2 — transform (crudo -> products.json)
        env:
          SERLACA_IMAGE_BASE: ${{ secrets.SERLACA_IMAGE_BASE }}
          MARGIN_PERCENT_DEFAULT: ${{ secrets.MARGIN_PERCENT_DEFAULT }}
        run: uv run renovarte-pipeline transform

      - name: Checkout dedicado de renovarte-catalogo
        uses: actions/checkout@v4
        with:
          repository: gucastillo-personal/renovarte-catalogo
          path: catalogo-checkout
          token: ${{ secrets.CATALOGO_PAT }}

      - name: Etapa 3 — publish (leak-check + PR)
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOGO_PAT }}
        run: uv run renovarte-pipeline publish --catalogo catalogo-checkout --live
